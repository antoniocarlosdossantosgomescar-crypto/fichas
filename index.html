<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#181410">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ficha de Treino – Antônio Carlos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EFE6D7; --paper:#FBF7EF; --raise:#F4ECDC; --ink:#181410; --ink2:#5F564A;
  --line:#DCCDAE; --gold:#A98253; --gold-ink:#7C5C31; --on-gold:#181410;
  --sel-bg:#181410; --sel-fg:#F3EAD9; --danger:#9A3B2E; --shadow:0 1px 0 rgba(24,20,16,.04),0 8px 24px -16px rgba(24,20,16,.35);
  --display:'Cormorant Garamond','Iowan Old Style',Georgia,'Times New Roman',serif;
  --ui:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12100D; --paper:#1B1712; --raise:#241F18; --ink:#F1E9DA; --ink2:#B7AB92;
    --line:#3A3227; --gold:#C79F65; --gold-ink:#DDB981; --on-gold:#14110D;
    --sel-bg:#C79F65; --sel-fg:#14110D; --danger:#E08A7A; --shadow:0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#12100D; --paper:#1B1712; --raise:#241F18; --ink:#F1E9DA; --ink2:#B7AB92;
  --line:#3A3227; --gold:#C79F65; --gold-ink:#DDB981; --on-gold:#14110D;
  --sel-bg:#C79F65; --sel-fg:#14110D; --danger:#E08A7A; --shadow:0 8px 24px -16px rgba(0,0,0,.8);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--ui);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* layout */
.app{display:flex;flex-direction:column;height:100%}
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--paper);border-bottom:1px solid var(--line)}
.logochip{background:#EFE6D7;border-radius:12px;padding:3px 10px;display:flex;flex:none}
.logochip img{height:46px;width:auto;display:block}
.bar .grow{flex:1}
.crumb{font-weight:600;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{flex:1;overflow-y:auto;min-height:0;padding:0 0 64px}
.wrap{max-width:1040px;margin:0 auto;padding:0 28px}
@media (max-width:640px){.wrap{padding:0 16px}.bar{padding:8px 12px;gap:8px}.crumb{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:600}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-bg)}
.btn.gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;padding:0 14px;font-size:14px;font-weight:500}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.block{width:100%}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-left:2px}

/* home */
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:26px 0 14px}
.home-head h1{font:600 clamp(34px,5vw,50px)/1 var(--display);margin:0}
.home-head .sub{margin:6px 0 0;color:var(--ink2);font-size:14px}
.home-tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.home-tools input{flex:1;min-width:220px;height:48px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:0 16px;font-size:16px}
.home-tools .seg{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.acard{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.acard-main{display:block;text-align:left;width:100%;border:0;background:transparent;padding:18px 18px 12px}
.acard-top{display:flex;align-items:center;gap:14px}
.acard .avatar{width:52px;height:52px;font-size:24px}
.acard-n{display:block;font:600 26px/1.05 var(--display);overflow-wrap:anywhere}
.acard-o{display:block;font-size:14px;color:var(--ink2);margin-top:3px}
.acard-m{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tag{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--raise);border:1px solid var(--line);color:var(--ink2);font-weight:500}
.acard-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 12px 18px;border-top:1px solid var(--line);background:var(--bg)}
.acard-foot span{font-size:13px;color:var(--ink2);min-width:0}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px;padding:14px 16px;border-radius:14px;background:var(--raise);border:1px solid var(--gold)}
.banner span{color:var(--ink2)}
.banner-a{display:flex;gap:8px}
.avatar{flex:none;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font:600 20px/1 var(--display);color:var(--gold-ink)}

/* main header */
.mhead{padding:22px 0 0}
.mhead-top{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap}
.mhead h1{font:600 clamp(30px,4.2vw,44px)/1.05 var(--display);margin:0;letter-spacing:.005em}
.mhead .sub{color:var(--ink2);font-size:14px;margin-top:6px;min-height:20px}
.mhead-actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin:22px 0 22px;border-bottom:1px solid var(--line)}
.tab{min-height:50px;border:0;background:transparent;font-weight:600;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.stack{display:grid;gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card h2{font:600 26px/1.1 var(--display);margin:0 0 14px}
.card h3{margin:0 0 10px;font:600 15px/1.2 var(--ui)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px 16px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.fld{display:grid;gap:6px;font-size:14px;color:var(--ink2);font-weight:500}
.fld input,.fld textarea{width:100%;min-height:48px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;font-size:17px;color:var(--ink)}
.fld textarea{min-height:120px;resize:vertical;line-height:1.5}
.fld input:focus,.fld textarea:focus{border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:46px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font-weight:500}
.chip[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-bg)}
.chip.sm{min-height:38px;padding:0 14px;font-size:14px}
.save-status{font-size:13px;color:var(--ink2)}

/* empty */
.empty{display:grid;place-items:center;min-height:70vh;text-align:center;padding:32px}
.empty h1{font:600 clamp(34px,5vw,54px)/1.05 var(--display);margin:0 0 12px}
.empty p{color:var(--ink2);max-width:440px;margin:0 auto 22px}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* medidas */
.tbl-scroll{overflow-x:auto;margin:0 -20px;padding:0 20px}
table.med{border-collapse:separate;border-spacing:0;min-width:100%}
table.med th,table.med td{padding:6px 8px;text-align:center;vertical-align:top}
table.med thead th{font-weight:600;font-size:13px;color:var(--ink2);padding-bottom:10px}
table.med tbody th{position:sticky;left:0;background:var(--paper);text-align:left;font-weight:600;font-size:14px;padding-right:14px;min-width:150px;white-space:nowrap;z-index:1}
table.med tbody th small{display:block;font-weight:400;color:var(--ink2);font-size:12px}
table.med tbody tr>*{border-top:1px solid var(--line)}
table.med td{min-width:124px}
table.med input[type=text],table.med input[type=date]{width:100%;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;text-align:center;padding:0 6px;font-size:16px;color:var(--ink)}
table.med input:focus{border-color:var(--gold)}
table.med input[type=date]{font-size:13px;color-scheme:light dark}
.av-head{display:grid;gap:4px;justify-items:center}
.av-x{border:0;background:transparent;color:var(--ink2);font-size:12px;min-height:30px;padding:0 8px;text-decoration:underline}
.delta{display:block;font-size:12px;min-height:16px;margin-top:3px;color:var(--ink2);font-variant-numeric:tabular-nums}
.delta.up{color:var(--gold-ink);font-weight:600}
.delta.down{color:var(--gold-ink);font-weight:600}
.imc{font-weight:600;padding-top:14px;font-variant-numeric:tabular-nums}
.chart-wrap{margin-top:14px}
.chart-wrap svg{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-line{fill:none;stroke:var(--gold);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.ch-dot{fill:var(--paper);stroke:var(--gold);stroke-width:3}
.ch-txt{fill:var(--ink2);font:12px var(--ui)}
.ch-val{fill:var(--ink);font:600 13px var(--ui)}
.hint{color:var(--ink2);font-size:14px;margin:0}

/* treino */
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{min-height:42px;padding:0 18px;border:0;background:transparent;border-radius:9px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--sel-bg);color:var(--sel-fg)}
.week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:16px}
.dia{min-height:84px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);display:grid;align-content:center;justify-items:center;gap:8px;padding:8px 4px}
.dia-n{font:600 22px/1 var(--display)}
.dia-g{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:20px}
.dia-g i{font:700 11px/1 var(--ui);font-style:normal;background:var(--gold);color:var(--on-gold);border-radius:5px;padding:4px 5px}
.dia-g em{font-style:normal;font-size:12px;color:var(--ink2)}
.dia.on{background:var(--sel-bg);color:var(--sel-fg);border-color:var(--sel-bg)}
.dia.on .dia-g em{color:inherit;opacity:.75}
.gpick{display:flex;flex-wrap:wrap;gap:8px}
.gchip{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 14px 0 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:500}
.gchip .badge{width:28px;height:28px;font-size:17px;border-radius:8px}
.gchip[aria-pressed="true"]{border-color:var(--gold);background:var(--raise);font-weight:600;box-shadow:inset 0 0 0 1px var(--gold)}
.badge{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--gold);color:var(--on-gold);font:700 21px/1 var(--display)}
.gcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.gcard+.gcard{margin-top:14px}
.ghead{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:12px 18px;border:0;background:transparent;text-align:left}
.ghead .gt{flex:1;font:600 24px/1.1 var(--display)}
.ghead .gc{font-size:13px;color:var(--ink2)}
.ghead .chev{width:10px;height:10px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);margin:0 6px 4px 4px}
.gcard.open .chev{transform:rotate(-135deg);margin-bottom:-4px}
.gbody{border-top:1px solid var(--line)}
.ex{border-bottom:1px solid var(--line);position:relative}
.ex:last-of-type{border-bottom:0}
.ex.on{background:var(--raise);box-shadow:inset 3px 0 0 var(--gold)}
.ex-main{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;padding:8px 18px;border:0;background:transparent;text-align:left;font-size:17px}
.ex.on .ex-main{font-weight:600}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--gold);display:inline-block;position:relative;background:var(--paper)}
.ex.on .box{background:var(--gold)}
.ex.on .box::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid var(--on-gold);border-width:0 3px 3px 0;transform:rotate(45deg)}
.ex-rm{position:absolute;right:8px;top:6px;border:0;background:transparent;color:var(--ink2);min-height:40px;padding:0 10px;font-size:13px;text-decoration:underline}
.ex-ctl{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-start;padding:2px 18px 16px 58px}
.ctl{display:grid;gap:6px;font-size:13px;color:var(--ink2);font-weight:500}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}
.step button{width:46px;height:46px;border:0;background:transparent;font-size:24px;line-height:1;color:var(--gold-ink)}
.step button:active{background:var(--raise)}
.step input{width:66px;height:46px;text-align:center;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--bg);font-weight:700;font-size:18px;border-radius:0;color:var(--ink)}
.step .un{padding:0 12px 0 8px;color:var(--ink2);font-size:14px}
.reps{display:grid;gap:8px}
.reps input{height:46px;width:130px;border:1px solid var(--line);background:var(--bg);border-radius:12px;text-align:center;font-weight:700;font-size:18px;color:var(--ink)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.gadd{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line);background:var(--bg)}
.gadd input{flex:1;min-width:0;min-height:46px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:0 14px}
.dia-vazio{border:1.5px dashed var(--line);border-radius:16px;padding:26px;text-align:center;color:var(--ink2)}

/* ficha */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.toolbar .hint{flex-basis:100%}
.sheet{background:#fff;color:#181410;border:1px solid #DCCDAE;border-radius:6px;padding:28px 32px;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:13px;line-height:1.4;box-shadow:0 12px 30px -20px rgba(0,0,0,.5)}


/* hoje */
.hprog{position:sticky;top:0;z-index:5;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.hprog-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.hprog-n{font:600 26px/1 var(--display)}
.hprog-a{display:flex;gap:8px}
.prog{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .25s}
.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.opts .seg{margin:0}
.opts .lbl{font-size:13px;color:var(--ink2);font-weight:500;margin-right:-6px}
.hgroup{display:flex;align-items:center;gap:10px;margin:22px 2px 10px;font:600 24px/1 var(--display)}
.hex{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;margin-bottom:12px}
.hex.ok{border-color:var(--gold);box-shadow:inset 4px 0 0 var(--gold)}
.hex-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hex-n{font-weight:700;font-size:19px}
.hex.ok .hex-n::after{content:" ✓";color:var(--gold-ink)}
.hex-s{color:var(--ink2);font-size:14px;margin-top:2px}
.sets{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.set{width:58px;height:58px;border-radius:50%;border:2px solid var(--gold);background:var(--bg);font:700 21px/1 var(--ui);color:var(--gold-ink)}
.set.done{background:var(--gold);color:var(--on-gold)}
.set:active{transform:scale(.94)}
.hist{display:grid;gap:0}
.hist-r{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.hist-r:first-child{border-top:0}
.hist-r span:last-child{color:var(--ink2)}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;align-items:center;gap:14px;background:var(--sel-bg);color:var(--sel-fg);padding:10px 12px 10px 20px;border-radius:999px;box-shadow:0 12px 30px -10px rgba(0,0,0,.6)}
.rest b{font:700 26px/1 var(--ui);font-variant-numeric:tabular-nums;min-width:58px;text-align:center}
.rest button{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid currentColor;background:transparent;font-weight:600}
.rest.fim{background:var(--gold);color:var(--on-gold)}

/* backup */
.bk{display:grid;gap:10px;margin:6px 0 4px}
.bk small{color:var(--ink2);font-size:13px}
.bk hr{border:0;border-top:1px solid var(--line);margin:8px 0;width:100%}
.lix{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.modal{max-height:calc(100% - 10px);overflow-y:auto}


/* financeiro */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 16px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi small{display:block;color:var(--ink2);font-size:13px}
.kpi b{display:block;font:600 27px/1.1 var(--display);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi.alert{border-color:var(--danger)}
.kpi.alert b{color:var(--danger)}
.kpi.good b{color:var(--gold-ink)}
.mes-nav{display:flex;align-items:center;gap:8px;margin:0 0 16px}
.mes-nav h2{font:600 30px/1 var(--display);margin:0;flex:1;text-align:center}
.fhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:26px 0 16px}
.fhead h1{font:600 clamp(34px,5vw,50px)/1 var(--display);margin:0}
.fhead-a{display:flex;gap:8px;flex-wrap:wrap}
.frow{display:flex;align-items:center;gap:10px 14px;padding:12px 2px;border-top:1px solid var(--line);flex-wrap:wrap}
.frow:first-child{border-top:0}
.frow-main{flex:1 1 220px;display:grid;gap:2px;text-align:left;background:transparent;border:0;padding:0;min-height:44px;align-content:center}
.frow-n{font-weight:600;font-size:16px}
.frow-s{font-size:13px;color:var(--ink2)}
.frow-v{font-weight:700;font-variant-numeric:tabular-nums;min-width:92px;text-align:right}
.frow-a{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;color:var(--ink2)}
.pill.pago{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.pill.atrasado{color:var(--danger);border-color:var(--danger)}
.pill.breve{background:var(--raise);border-color:var(--gold);color:var(--gold-ink)}
.tag.warn{color:var(--danger);border-color:var(--danger);background:transparent;font-weight:600}
.tag.okay{color:var(--gold-ink);border-color:var(--gold)}
.banner.warn{border-color:var(--danger)}
.bar-prev{fill:var(--line)}
.bar-rec{fill:var(--gold)}
.resumo-fin{display:flex;gap:10px 22px;flex-wrap:wrap;margin:0 0 4px}
.resumo-fin div{font-size:14px;color:var(--ink2)}
.resumo-fin b{display:block;font:600 22px/1.1 var(--display);color:var(--ink)}
.legenda{display:flex;gap:16px;font-size:13px;color:var(--ink2);margin-top:6px}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tabs{overflow-x:auto}
.tab{flex:1 0 auto;min-width:84px;padding:0 12px}
.btn.icon{padding:0;width:44px;font-size:22px;line-height:1}
a.btn{text-decoration:none}
.card svg{max-height:230px;width:100%}
@media (max-width:560px){.logochip{display:none}.bar{gap:6px;padding:8px 10px}.bar .btn.small{padding:0 10px}.bar .btn.icon{width:40px}}

/* ajuda */
details.help{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.help summary{list-style:none;cursor:pointer;padding:14px 18px;min-height:58px;font:600 23px/1.2 var(--display);display:flex;align-items:center;justify-content:space-between;gap:12px}
details.help summary::-webkit-details-marker{display:none}
details.help summary::after{content:"+";font:400 26px/1 var(--ui);color:var(--gold-ink)}
details.help[open] summary::after{content:"−"}
.help-b{padding:0 18px 16px;line-height:1.6}
.help-b p{margin:0 0 10px}
.help-b ol,.help-b ul{margin:0 0 10px;padding-left:22px}
.help-b li{margin:6px 0}
.help-b .dica{background:var(--raise);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0;font-size:15px}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(10,8,5,.55);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(460px,100%);box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.modal h2{font:600 28px/1.1 var(--display);margin:0 0 12px}
.modal p{margin:0 0 16px;color:var(--ink2)}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sel-bg);color:var(--sel-fg);padding:12px 20px;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}

@media (max-width:640px){.seg{max-width:100%}.seg button{padding:0 11px}.tab{font-size:14px}}
@media print{
  @page{size:A4;margin:10mm}
  html,body{height:auto;background:#fff}
  :root{padding:0}
  .bar,.mhead,.tabs,.toolbar,.toast,.overlay,.rest{display:none!important}
  .app{display:block;height:auto}
  .main{overflow:visible;padding:0}
  .wrap{max-width:none;padding:0}
  .sheet{border:0;box-shadow:none;padding:0}
}
</style>
<style id="sheetCss">
.sheet *{box-sizing:border-box}
.sh-head{display:flex;align-items:center;gap:22px;border-bottom:2px solid #A98253;padding-bottom:14px;margin-bottom:16px}
.sh-logo{height:78px;width:auto}
.sh-head h1{font:700 32px/1 'Cormorant Garamond',Georgia,serif;margin:0 0 6px;letter-spacing:.01em}
.sh-head p{margin:0;color:#5F564A}
.sh-info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px;margin-bottom:8px}
.sh-info div{border-bottom:1px solid #DCCDAE;padding-bottom:4px}
.sh-info .full{grid-column:1/-1}
.sh-info dt{font-size:11px;color:#7C5C31;font-weight:600}
.sh-info dd{margin:0;font-size:14px;min-height:20px}
.sheet h2{font:700 21px/1.1 'Cormorant Garamond',Georgia,serif;margin:20px 0 10px;padding-left:10px;border-left:4px solid #A98253}
.sh-day{break-inside:avoid;margin-bottom:12px}
.sh-day h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 4px;font-size:14px;background:#181410;color:#F3EAD9;padding:6px 10px;border-radius:4px}
.sh-day h3 span{font-weight:400;color:#DDB981;font-size:12px}
.sheet table{width:100%;border-collapse:collapse}
.sheet th,.sheet td{border:1px solid #DCCDAE;padding:5px 8px;text-align:left;font-size:12.5px}
.sheet th{background:#F4ECDC;color:#7C5C31;font-weight:600;font-size:11.5px}
.sheet td.c,.sheet th.c{text-align:center}
.sheet .sh-g td{background:#FBF7EF;font-weight:600}
.sheet .sh-none{color:#8a7f6d;font-style:italic}
.sh-foot{margin-top:18px;text-align:center;color:#7C5C31;font:italic 13px 'Cormorant Garamond',Georgia,serif}
.sh-med{break-inside:avoid}
@media (max-width:640px){.sh-info{grid-template-columns:1fr 1fr}.sheet th,.sheet td{padding:4px 5px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar" id="bar"></header>
  <main class="main" id="main"></main>
</div>
<div id="rest-root"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<input type="file" id="arquivo" accept=".json,application/json" hidden>

function stepper(get,set,{step,min,unit,label}){
  const inp=h('input',{type:'text',inputmode:'decimal','aria-label':label,autocomplete:'off'}); inp.value=get()==null||get()===''?'':String(get()).replace('.',',');
  const apply=v=>{ set(v); inp.value=v==null?'':fmtNum(v); };
  const dec=h('button',{type:'button','aria-label':'Diminuir '+label,onclick:()=>{ const c=parseNum(inp.value)||0; apply(Math.max(min,Math.round((c-step)*100)/100)); }},'−');
  const inc=h('button',{type:'button','aria-label':'Aumentar '+label,onclick:()=>{ const c=parseNum(inp.value)||0; apply(Math.round((c+step)*100)/100); }},'+');
  inp.addEventListener('input',()=>{ set(inp.value.trim()===''?'':(parseNum(inp.value)==null?inp.value:parseNum(inp.value))); });
  inp.addEventListener('focus',()=>inp.select());

function paintDerived(a){
  MEDIDAS.forEach(([k])=>{ let prev=null;
    a.medidas.forEach((m,i)=>{ const v=parseNum(m[k]); const el=deltaEls[k+'|'+i];
      if(el){ if(v!=null&&prev!=null){ const d=Math.round((v-prev)*100)/100; el.textContent=d===0?'igual':(d>0?'+':'−')+fmtNum(Math.abs(d)); el.className='delta '+(d>0?'up':d<0?'down':'eq'); } else { el.textContent=''; el.className='delta'; } }

  a.medidas.forEach((m,i)=>{ const el=imcEls[i]; if(el){ const v=imc(m.mc,m.est); el.textContent=v==null?'–':fmtNum(v); } });

function drawChart(a){
  const box=$('#chart'); if(!box) return;
  const k=ui.medidaSel; const info=MEDIDAS.find(x=>x[0]===k);
  const pts=a.medidas.map(m=>({d:m.data,v:parseNum(m[k])})).filter(p=>p.v!=null);
  if(pts.length<2){ box.replaceChildren(h('p',{class:'hint'},'Registre ao menos duas avaliações com '+info[1].replace(/ \(.*\)/,'').toLowerCase()+' para ver a evolução.')); return; }
  const W=640,H=230,L=46,R=22,T=30,B=44;
  let mn=Math.min(...pts.map(p=>p.v)), mx=Math.max(...pts.map(p=>p.v)); if(mn===mx){ mn-=1; mx+=1; } const pad=(mx-mn)*.18; mn-=pad; mx+=pad;
  const X=i=>L+i*(W-L-R)/(pts.length-1), Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  const NS='http://www.w3.org/2000/svg'; const el=(t,at,tx)=>{ const e=document.createElementNS(NS,t); for(const q in at) e.setAttribute(q,at[q]); if(tx!=null) e.textContent=tx; return e; };
  const svg=el('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':'Gráfico de '+info[1]});
  for(let g=0;g<3;g++){ const yy=T+(H-T-B)*g/2; svg.append(el('line',{x1:L,x2:W-R,y1:yy,y2:yy,class:'ch-grid'})); const val=mx-(mx-mn)*g/2; svg.append(el('text',{x:L-8,y:yy+4,'text-anchor':'end',class:'ch-txt'},fmtNum(val))); }
  svg.append(el('polyline',{points:pts.map((p,i)=>X(i)+','+Y(p.v)).join(' '),class:'ch-line'}));
  pts.forEach((p,i)=>{ svg.append(el('circle',{cx:X(i),cy:Y(p.v),r:6,class:'ch-dot'})); svg.append(el('text',{x:X(i),y:Y(p.v)-14,'text-anchor':'middle',class:'ch-val'},fmtNum(p.v)+' '+info[2])); svg.append(el('text',{x:X(i),y:H-16,'text-anchor':'middle',class:'ch-txt'},fmtData(p.d))); });
  box.replaceChildren(svg);
}

/* descanso e tela ligada */
let restT=null,restFim=0,wl=null;
function iniciarDescanso(){

  $('#rest-root').replaceChildren(h('div',{class:'rest',role:'timer'},h('span',null,'Descanso'),h('b',{id:'restN'},'0:00'),h('button',{type:'button',onclick:pararDescanso},'Pular')));
  tickRest(); restT=setInterval(tickRest,250);

function tickRest(){

  if(left>0){ n.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0'); return; }
  clearInterval(restT); try{ if(navigator.vibrate) navigator.vibrate([250,120,250]); }catch(e){}
  $('#rest-root').replaceChildren(h('div',{class:'rest fim',role:'alert'},h('span',null,'Descanso terminou'),h('button',{type:'button',onclick:pararDescanso},'Ok')));

  catch(e){ toast('O navegador não permitiu manter a tela ligada.'); return false; }
}

/* ---------- financeiro: cálculos ---------- */
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const compAtual = () => todayISO().slice(0,7);
function addMeses(comp,n){ let p=comp.split('-').map(Number); let y=p[0], m=p[1]+n; y+=Math.floor((m-1)/12); m=((m-1)%12+12)%12+1; return y+'-'+String(m).padStart(2,'0'); }
const labelMes = comp => MESES[+comp.slice(5)-1]+' de '+comp.slice(0,4);
const labelCurto = comp => MESES[+comp.slice(5)-1].slice(0,3)+'/'+comp.slice(2,4);
function dataVenc(comp,dia){ const y=+comp.slice(0,4), m=+comp.slice(5); const ult=new Date(y,m,0).getDate(); const d=Math.min(Math.max(1,parseInt(dia)||1),ult); return comp+'-'+String(d).padStart(2,'0'); }
function difDias(a,b){ const pa=a.split('-').map(Number), pb=b.split('-').map(Number); return Math.round((Date.UTC(pa[0],pa[1]-1,pa[2])-Date.UTC(pb[0],pb[1]-1,pb[2]))/864e5); }
const fmtLonga = iso => (iso||'').split('-').reverse().join('/');
function brl(n){ n=Number(n)||0; const s=Math.abs(n).toFixed(2).split('.'); return (n<0?'-':'')+'R$ '+s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+s[1]; }

function cobrancas(a){
  const f=a.fin; const out=[]; const vp=parseNum(f.valor);
  if(vp!=null&&f.inicio){
    const per=[1,3,6,12].includes(+f.periodo)?+f.periodo:1;
    const lim=addMeses(compAtual(),per); const fimComp=f.ativo?null:(f.fim||compAtual());
    let comp=f.inicio, n=0;
    while(comp<=lim&&n<180){
      const reg=f.pag[comp]||null;
      if(!fimComp||comp<fimComp||reg){
        const cv=parseNum(f.custom[comp]);
        const mes=MESES[+comp.slice(5)-1];
        out.push({key:'m:'+comp,comp,venc:dataVenc(comp,f.venc),valor:cv!=null?cv:vp,extra:false,reg,aluno:a,
          desc:per===1?'mensalidade de '+mes:'cobrança '+PLANOS[per].toLowerCase()+' (início em '+mes+')'});
      }
      comp=addMeses(comp,per); n++;
    }
  }
  f.extras.forEach(x=>out.push({key:'x:'+x.id,comp:(x.venc||todayISO()).slice(0,7),venc:x.venc||todayISO(),valor:parseNum(x.valor)||0,desc:x.desc||'cobrança avulsa',extra:true,reg:x.reg||null,aluno:a,ref:x}));
  return out;
}
const todasCobrancas = () => store.alunos.flatMap(a=>cobrancas(a));
function statusCob(c){
  if(c.reg&&c.reg.st==='pago') return 'pago';
  if(c.reg&&c.reg.st==='isento') return 'isento';
  const hoje=todayISO(); if(c.venc<hoje) return 'atrasado';
  return difDias(c.venc,hoje)<=5?'breve':'aberto';
}
function pillTxt(c){
  const s=statusCob(c);
  if(s==='atrasado'){ const d=difDias(todayISO(),c.venc); return 'Atrasado há '+d+(d===1?' dia':' dias'); }
  if(s==='breve'){ const d=difDias(c.venc,todayISO()); return d===0?'Vence hoje':'Vence em '+d+(d===1?' dia':' dias'); }
  return s==='pago'?'Pago':s==='isento'?'Isento':'Em aberto';
}
const valorRecebido = c => { const v=parseNum(c.reg&&c.reg.valor); return v==null?c.valor:v; };
function atrasoTotal(){ let n=0,v=0; todasCobrancas().forEach(c=>{ if(statusCob(c)==='atrasado'){ n++; v+=c.valor; } }); return {n,v}; }
function setReg(c,reg){
  const a=c.aluno;
  if(c.extra) c.ref.reg=reg; else if(reg) a.fin.pag[c.comp]=reg; else delete a.fin.pag[c.comp];
  touch(a);
}
function refreshFin(){
  renderBar();
  if(ui.tela==='fin') renderFin();
  else if(ui.tela==='aluno'&&ui.tab==='financeiro'){ const st=$('#main').scrollTop; pintaFin(cur()); $('#main').scrollTop=st; }
  else if(ui.tela==='home') renderHome();
}

function waLink(tel,texto){
  let d=(tel||'').replace(/\D/g,''); if(d.length===10||d.length===11) d='55'+d;
  return 'https://wa.me/'+d+'?text='+encodeURIComponent(texto);
}
function montarMsg(c,tipo){
  const F=store.config.fin; const a=c.aluno;
  const modelo=tipo==='atraso'?F.msgAtraso:F.msgLembrete;
  const pix=F.pix?'Chave Pix: '+F.pix:'';
  const primeiro=(a.nome||'').trim().split(/\s+/)[0]||'aluno';
  return modelo.split('\n').filter(l=>!(l.trim()==='{pix}'&&!pix)&&!(l.trim()==='{assinatura}'&&!F.assinatura)).join('\n')
    .replace(/\{nome\}/g,primeiro).replace(/\{descricao\}/g,c.desc).replace(/\{valor\}/g,brl(c.valor))
    .replace(/\{vencimento\}/g,fmtLonga(c.venc)).replace(/\{pix\}/g,pix).replace(/\{assinatura\}/g,F.assinatura||'');
}

function abrirPagamento(c){
  const a=c.aluno; const reg=c.reg;
  const valor=h('input',{type:'text',inputmode:'decimal',autocomplete:'off'}); valor.value=fmtNum(reg&&reg.st==='pago'?valorRecebido(c):c.valor);
  const data=h('input',{type:'date'}); data.value=(reg&&reg.em)||todayISO();
  const obs=h('input',{type:'text',autocomplete:'off',placeholder:'Opcional'}); obs.value=(reg&&reg.obs)||'';
  let forma=(reg&&reg.forma)||'Pix';
  const chips=h('div',{class:'chips'});
  const pinta=()=>chips.replaceChildren(...FORMAS.map(f=>h('button',{class:'chip sm',type:'button','aria-pressed':forma===f?'true':'false',onclick:()=>{ forma=f; pinta(); }},f)));
  pinta();
  const corpo=h('div',{style:'display:grid;gap:12px'},
    h('div',{class:'grid2'},fld('Valor (R$)',valor),fld('Data do pagamento',data)),
    h('div',null,h('h3',null,'Forma de pagamento'),chips),
    fld('Observação',obs));
  const acoes=[{txt:'Cancelar',fn:()=>{}}];
  if(reg) acoes.push({txt:'Desfazer',cls:'danger',fn:()=>{ setReg(c,null); refreshFin(); toast('Pagamento desfeito.'); }});
  else acoes.push({txt:'Isentar',cls:'ghost',fn:()=>{ setReg(c,{st:'isento',em:todayISO(),obs:obs.value.trim()}); refreshFin(); toast('Cobrança marcada como isenta.'); }});
  if(c.extra) acoes.push({txt:'Excluir cobrança',cls:'danger',fn:()=>{ a.fin.extras=a.fin.extras.filter(x=>x.id!==c.ref.id); touch(a); refreshFin(); toast('Cobrança excluída.'); }});
  acoes.push({txt:reg&&reg.st==='pago'?'Salvar alterações':'Registrar pagamento',cls:'primary',fn:()=>{
    const v=parseNum(valor.value); if(v==null||v<0){ toast('Informe o valor.'); return false; }
    if(!data.value){ toast('Informe a data do pagamento.'); return false; }
    if(c.extra) c.ref.valor=String(v);
    else { const vp=parseNum(a.fin.valor); if(vp!=null&&Math.abs(v-vp)<0.004) delete a.fin.custom[c.comp]; else a.fin.custom[c.comp]=String(v); }
    setReg(c,{st:'pago',em:data.value,forma,valor:String(v),obs:obs.value.trim()}); refreshFin(); toast('Pagamento registrado.'); }});
  modal({titulo:cap(c.desc),texto:'Vencimento em '+fmtLonga(c.venc)+(c.valor?' • '+brl(c.valor):''),corpo,acoes});
}

/* ---------- financeiro: linhas de cobrança ---------- */
function cobRow(c,painel){
  const a=c.aluno; const st=statusCob(c); const aviso=a.fin.avisos[c.key];
  const sub=[];
  if(st==='pago') sub.push('Pago em '+fmtData(c.reg.em)+(c.reg.forma?' via '+c.reg.forma:''));
  else if(st==='isento') sub.push('Cobrança isenta');
  else sub.push('Vence em '+fmtData(c.venc));
  if(aviso&&st!=='pago'&&st!=='isento') sub.push('cobrado em '+fmtData(isoDe(new Date(aviso))));
  const titulo=painel?(a.nome||'Sem nome'):cap(c.desc);
  const linha2=painel?cap(c.desc)+'. '+sub.join(', '):sub.join(', ');
  const acoes=[];
  if(st==='pago'){ acoes.push(h('button',{class:'btn small',type:'button',onclick:()=>abrirRecibo(c)},'Recibo')); }
  else if(st!=='isento'){
    acoes.push(h('button',{class:'btn small',type:'button',onclick:()=>abrirCobranca(c)},'Cobrar'));
    acoes.push(h('button',{class:'btn small gold',type:'button',onclick:()=>abrirPagamento(c)},'Pagou'));
  }
  return h('div',{class:'frow'},
    h('button',{class:'frow-main',type:'button',onclick:()=>{ if(painel) abrir(a.id,'financeiro'); else abrirPagamento(c); }},h('span',{class:'frow-n'},titulo),h('span',{class:'frow-s'},linha2)),
    h('span',{class:'frow-v'},brl(st==='pago'?valorRecebido(c):c.valor)),
    h('span',{class:'pill '+st},pillTxt(c)),
    h('div',{class:'frow-a'},...acoes));
}

/* ---------- financeiro: painel geral ---------- */
function barrasFin(todas,mes){
  const meses=[]; for(let i=5;i>=0;i--) meses.push(addMeses(mes,-i));
  const dados=meses.map(m=>{ const l=todas.filter(c=>c.comp===m&&statusCob(c)!=='isento'); return {m,prev:l.reduce((s,c)=>s+c.valor,0),rec:l.filter(c=>statusCob(c)==='pago').reduce((s,c)=>s+valorRecebido(c),0)}; });
  const max=Math.max(1,...dados.map(d=>Math.max(d.prev,d.rec)));
  const W=640,H=210,L=12,R=12,T=26,B=34; const gw=(W-L-R)/dados.length;
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':'Recebido e previsto nos últimos seis meses'});
  dados.forEach((d,i)=>{
    const x=L+gw*i, bw=Math.min(34,gw/2-6);
    const hp=(H-T-B)*d.prev/max, hr=(H-T-B)*d.rec/max;
    svg.append(svgEl('rect',{x:x+gw/2-bw-2,y:H-B-hp,width:bw,height:Math.max(hp,d.prev?2:0),rx:4,class:'bar-prev'}));
    svg.append(svgEl('rect',{x:x+gw/2+2,y:H-B-hr,width:bw,height:Math.max(hr,d.rec?2:0),rx:4,class:'bar-rec'}));
    if(d.rec) svg.append(svgEl('text',{x:x+gw/2+2+bw/2,y:H-B-hr-6,'text-anchor':'middle',class:'ch-val'},Math.round(d.rec)));
    svg.append(svgEl('text',{x:x+gw/2,y:H-12,'text-anchor':'middle',class:'ch-txt'},labelCurto(d.m)));
  });
  return svg;
}

function linhaTreino(a,g,n){
  const c=a.ex[g.l+':'+n]; const s=nSeries(c); const cg=parseNum(c.c);
  return '• '+n+': '+s+' x '+(c.r?c.r:'séries')+(cg!=null&&cg>0?', '+fmtNum(cg)+' kg':'');
}
function blocoDia(a,k){
  const itens=itensDia(a,k); if(!itens.length) return null;
  const linhas=['*'+nomeDia(k)+'*'+(itens.length?' ('+itens.map(x=>x.g.n).join(', ')+')':'')];
  itens.forEach(({g,sel})=>{ if(itens.length>1) linhas.push('_'+g.n+'_'); sel.forEach(n=>linhas.push(linhaTreino(a,g,n))); });
  return linhas.join('\n');
}
function msgTreino(a,escopo,opts){
  const F=store.config.fin; const primeiro=(a.nome||'').trim().split(/\s+/)[0]||'aluno';
  const blocos=[];
  if(escopo==='semana'){
    DIAS.forEach(([k])=>{ const bl=blocoDia(a,k); if(bl) blocos.push(bl); });
    const usadas=new Set(); DIAS.forEach(([k])=>a.semana[k].forEach(l=>usadas.add(l)));
    const soltos=GRUPOS.filter(g=>!usadas.has(g.l)&&selCount(a,g)>0);
    if(soltos.length) blocos.push(['*Outros exercícios*',...soltos.flatMap(g=>['_'+g.n+'_',...exercisesOf(a,g).filter(n=>a.ex[g.l+':'+n]).map(n=>linhaTreino(a,g,n))])].join('\n'));
  } else { const bl=blocoDia(a,escopo); if(bl) blocos.push(bl); }
  let corpo=blocos.length?blocos.join('\n\n'):'Ainda não há exercícios montados para este período.';
  const partes=['Olá, '+primeiro+'! Segue o seu '+(escopo==='semana'?'treino da semana':'treino de '+nomeDia(escopo).toLowerCase())+'.','',corpo];
  if(opts.medidas){
    const av=a.medidas[a.medidas.length-1];
    if(av){ const ls=MEDIDAS.filter(([k])=>String(av[k]||'').trim()!=='').map(([k,nm,un])=>nm.replace(/ \(.*\)/,'')+': '+av[k]+' '+un);
      if(ls.length) partes.push('','*Medidas ('+fmtData(av.data)+')*',...ls); }
  }
  partes.push('','Qualquer dúvida é só me chamar.'); if(F.assinatura) partes.push(F.assinatura);
  return partes.join('\n');
}

  link.addEventListener('click',()=>{ a.enviadoEm=Date.now(); touch(a); });
  const copiar=h('button',{class:'btn',type:'button',onclick:async()=>{ try{ await navigator.clipboard.writeText(ta.value); toast('Mensagem copiada.'); }catch(e){ ta.focus(); ta.select(); toast('Selecione o texto e copie.'); } }},'Copiar mensagem');
  const nomeArq='treino-'+slug(a.nome)+'.html';
  const arquivo=()=>fichaHTML(a,{medidas:est.medidas,obs:est.obs});
  const podeArq=()=>{ try{ return !!(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File(['x'],'x.html',{type:'text/html'})]})); }catch(e){ return false; } };
  const tog=(txt,chave)=>h('button',{class:'chip sm',type:'button','aria-pressed':est[chave]?'true':'false',onclick:()=>{ est[chave]=!est[chave]; pinta(); }},txt);
  const pinta=()=>{
    const modo=h('div',{class:'seg',style:'margin:0',role:'group','aria-label':'Como enviar'},[['texto','Mensagem de texto'],['arquivo','Arquivo da ficha']].map(([k,t])=>h('button',{type:'button',class:est.modo===k?'on':'',onclick:()=>{ est.modo=k; pinta(); }},t)));
    const info=a.enviadoEm?h('p',{class:'hint',style:'margin:0'},'Última vez enviada em '+fmtTs(a.enviadoEm)+'.'):null;
    const semTel=!a.fin.tel?h('p',{class:'hint',style:'margin:0'},'Sem WhatsApp cadastrado. O WhatsApp vai pedir para você escolher o contato. Você pode cadastrar o número na aba Dados.'):null;
    if(est.modo==='texto'){
      const dias=DIAS.filter(d=>itensDia(a,d[0]).length);
      const escopo=h('div',{class:'chips'},[['semana','Semana toda'],...dias.map(d=>[d[0],d[2]])].map(([k,t])=>h('button',{class:'chip sm',type:'button','aria-pressed':est.escopo===k?'true':'false',onclick:()=>{ est.escopo=k; pinta(); }},t)));
      setMsg();
      pos(modo,info,semTel,h('div',null,h('h3',null,'O que enviar'),escopo),h('div',{class:'chips'},tog('Incluir medidas mais recentes','medidas')),ta,
        h('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},link,copiar),
        h('p',{class:'hint',style:'margin:0;font-size:13px'},'Você pode editar a mensagem antes de enviar. O financeiro nunca vai junto.'));
    } else {
      const bts=[];
      if(podeArq()) bts.push(h('button',{class:'btn primary',type:'button',onclick:async()=>{ const f=new File([arquivo()],nomeArq,{type:'text/html'}); try{ await navigator.share({files:[f],title:'Treino de '+(a.nome||'aluno')}); a.enviadoEm=Date.now(); touch(a); }catch(e){ if(!e||e.name!=='AbortError') toast('Não foi possível compartilhar. Use Baixar arquivo.'); } }},'Compartilhar arquivo'));
      bts.push(h('button',{class:(bts.length?'':'primary ')+'btn',type:'button',onclick:async()=>{ if(await salvarArquivo(nomeArq,arquivo(),'Arquivo baixado.')){ a.enviadoEm=Date.now(); touch(a); } }},'Baixar arquivo'));
      pos(modo,info,
        h('p',{style:'margin:0'},'A folha completa do treino, com a sua logo. O aluno abre no navegador do celular.'),
        h('div',null,h('h3',null,'Incluir na ficha'),h('div',{class:'chips'},tog('Medidas','medidas'),tog('Observações','obs'))),
        h('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},...bts),
        h('p',{class:'hint',style:'margin:0;font-size:13px'},(podeArq()?'Compartilhar abre a lista de aplicativos do aparelho (WhatsApp, e-mail, Drive). ':'Neste navegador, baixe o arquivo e envie pelo WhatsApp ou e-mail. ')+'Se o aplicativo não aceitar o arquivo, use a mensagem de texto. Para um PDF, abra a aba Ficha e use Imprimir ou salvar em PDF.'));
    }
  };
  pinta();
  modal({titulo:'Enviar ao aluno',corpo,acoes:[{txt:'Fechar',fn:()=>{}}]});
}

/* ---------- arquivos, backup e restauração ---------- */
let downloads=null;
if(window.claude&&window.claude.use){ window.claude.use('downloads').then(d=>{ downloads=d; }).catch(()=>{}); }
function slug(s){ return (s||'aluno').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'aluno'; }
async function salvarArquivo(nome,texto,msg){
  if(downloads){
    try{ await downloads.save({filename:nome,data:texto}); toast(msg); return true; }
    catch(e){ if(e&&e.code==='declined') return false; toast('Não foi possível salvar o arquivo.'); return false; }
  }
  try{
    const blob=new Blob([texto],{type:nome.endsWith('.json')?'application/json':nome.endsWith('.csv')?'text/csv;charset=utf-8':'text/html'}); const url=URL.createObjectURL(blob);
    const l=h('a',{href:url,download:nome}); document.body.append(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast(msg); return true;
  }catch(e){ toast('Não foi possível salvar o arquivo.'); return false; }
}
const pacote = alunos => ({app:'ficha-antonio-carlos',versao:3,exportadoEm:new Date().toISOString(),config:{fin:store.config.fin},alunos});
async function backupTodas(){
  const ok=await salvarArquivo('backup-fichas-antonio-carlos-'+todayISO()+'.json',JSON.stringify(pacote(store.alunos),null,1),'Backup salvo.');
  if(ok){ store.ultimoBackup=Date.now(); persist(); renderBar(); if(ui.tela==='home') renderHome(); }
  return ok;
}
function baixarFicha(a){ salvarArquivo('ficha-'+slug(a.nome)+'.json',JSON.stringify(pacote([a]),null,1),'Ficha salva. Restaure em Backup, quando precisar.'); }
function podeCompartilhar(){ try{ return !!(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File(['x'],'x.json',{type:'application/json'})]})); }catch(e){ return false; } }
async function compartilhar(){
  const f=new File([JSON.stringify(pacote(store.alunos),null,1)],'backup-fichas-'+todayISO()+'.json',{type:'application/json'});
  try{ await navigator.share({files:[f],title:'Backup das fichas de treino'}); store.ultimoBackup=Date.now(); persist(); renderBar(); if(ui.tela==='home') renderHome(); }
  catch(e){ if(!e||e.name!=='AbortError') toast('Não foi possível compartilhar o backup.'); }
}
function abrirBackup(){
  const n=store.alunos.length; let fechar=null;
  const ult=store.ultimoBackup;
  const btn=(txt,cls,fn)=>h('button',{class:'btn '+cls,type:'button',onclick:fn},txt);
  const corpo=h('div',{class:'bk'},
    h('p',{style:'margin:0'},n?(n===1?'1 ficha guardada neste aparelho.':n+' fichas guardadas neste aparelho.'):'Nenhuma ficha guardada ainda.',' ',ult?'Último backup: '+fmtTs(ult)+'.':'Você ainda não fez backup.'),
    btn('Baixar backup de todas as fichas','primary',async()=>{ if(await backupTodas()&&fechar) fechar(); }),
    podeCompartilhar()?btn('Enviar backup (WhatsApp, Drive, e-mail)','',()=>{ compartilhar(); }):null,
    h('small',null,'Guarde o arquivo no Google Drive ou envie para você mesmo. Se o navegador for limpo ou o tablet trocado, é ele que recupera tudo.'),
    h('hr'),
    btn('Restaurar de um arquivo de backup','',()=>{ if(fechar) fechar(); $('#arquivo').click(); }),
    h('small',null,'Fichas do arquivo entram junto com as atuais. Se a mesma ficha existir nos dois, vale a mais recente.'),
    store.lixeira.length?h('div',null,h('hr'),h('h3',{style:'margin:8px 0 4px'},'Excluídas recentemente'),
      ...store.lixeira.map(x=>h('div',{class:'lix'},h('span',null,(x.aluno.nome||'Sem nome')+' ('+fmtData(isoDe(new Date(x.em)))+')'),
        btn('Recuperar','small',()=>{ store.lixeira=store.lixeira.filter(y=>y!==x); store.alunos.push(norm(x.aluno)); persist(); if(fechar) fechar(); renderBar(); renderMain(); toast('Ficha recuperada.'); })))):null);
  fechar=modal({titulo:'Backup das fichas',corpo,acoes:[{txt:'Fechar',fn:()=>{}}]});
}
$('#arquivo').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result); if(!o||!Array.isArray(o.alunos)||!o.alunos.length) throw 0;
      const lista=o.alunos.filter(x=>x&&typeof x==='object'&&x.id).map(norm);
      let novos=0,atual=0;
      lista.forEach(x=>{ const y=store.alunos.find(z=>z.id===x.id); if(!y) novos++; else if((x.atualizado||0)>(y.atualizado||0)) atual++; });
      if(!novos&&!atual){ toast('Suas fichas já estão iguais ou mais recentes que as do arquivo.'); return; }
      modal({titulo:'Restaurar fichas?',texto:'O arquivo tem '+lista.length+(lista.length===1?' ficha':' fichas')+': '+novos+(novos===1?' nova':' novas')+' e '+atual+(atual===1?' mais recente':' mais recentes')+' que a versão daqui.',
        acoes:[{txt:'Cancelar',fn:()=>{}},{txt:'Restaurar',cls:'primary',fn:()=>{
          if(o.config&&o.config.fin&&!store.config.fin.pix&&o.config.fin.pix) store.config.fin=Object.assign({},store.config.fin,o.config.fin);
          lista.forEach(x=>{ const i=store.alunos.findIndex(z=>z.id===x.id); if(i<0) store.alunos.push(x); else if((x.atualizado||0)>(store.alunos[i].atualizado||0)) store.alunos[i]=x; });
          persist(); renderBar(); if(ui.tela==='aluno'&&!cur()) irHome(true); else renderMain(); toast('Fichas restauradas.'); }}]});
    }catch(err){ toast('Esse arquivo não parece ser um backup válido.'); }
  };
  r.readAsText(f); e.target.value='';
});

/* ---------- tema ---------- */
const TEMAS=['auto','light','dark']; const TNOME={auto:'automático',light:'claro',dark:'escuro'};
let tema='auto'; try{ tema=localStorage.getItem(THEME_KEY)||'auto'; }catch(e){}
function aplicaTema(){ if(tema==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',tema); }
function mudaTema(){ tema=TEMAS[(TEMAS.indexOf(tema)+1)%3]; try{ localStorage.setItem(THEME_KEY,tema); }catch(e){} aplicaTema(); toast('Tema '+TNOME[tema]+'.'); }
aplicaTema();

window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); promptInstall=e; renderBar(); });
window.addEventListener('appinstalled',()=>{ promptInstall=null; renderBar(); });
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }

renderBar(); renderHome();
})();
</script>
